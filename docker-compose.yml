# Canopy Control: the API (the only service exposed; Coolify routes its domain to api:8000) and an
# upstream iSponsorBlockTV image (one method patched at runtime, see its command) that skips sponsors
# on the TVs people turn it on for.
#
# api owns iSponsorBlockTV's config.json on the shared isbtv-config volume (read-only for
# isponsorblocktv) and rewrites it, atomically and only on a change, when a TV's "Skip sponsors"
# changes. iSponsorBlockTV reads its config only at startup, so its service runs the upstream
# command under the small wrapper below, which restarts it when config.json changes.
# No Docker socket anywhere. Both services: non-root, read-only root fs, no capabilities.

x-hardening: &hardening
  restart: unless-stopped
  user: "10001:10001"  # the same uid/gid in both: api writes config.json 0640, isponsorblocktv reads it
  read_only: true
  tmpfs: ["/tmp:size=16m,mode=1777"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

services:
  api:
    <<: *hardening
    build: .
    expose: ["8000"]  # Coolify's proxy reaches it here; nothing is published on the host
    environment:
      CAPTION_LANG: ${CAPTION_LANG:-en}
      CANOPY_ACCOUNT_URL: ${CANOPY_ACCOUNT_URL:-https://account.canopysf.com}
      CANOPY_ACCOUNT_KEY: ${CANOPY_ACCOUNT_KEY:?set CANOPY_ACCOUNT_KEY}  # the server refuses to start without it
      CANOPY_APNS_URL: ${CANOPY_APNS_URL:-https://apns.canopysf.com}
      CANOPY_APNS_KEY: ${CANOPY_APNS_KEY:-}  # optional; without it there are no Live Activity pushes
      AUTOPLAY_GUARD: ${AUTOPLAY_GUARD:-1}  # pause videos the TV autoplays; 0 turns it off
      # Skip sponsors: on because this is set. The rest are iSponsorBlockTV's settings (isbtv.py).
      ISPONSORBLOCKTV_CONFIG: /isbtv/config.json
      SKIP_HIDDEN_PERSON_IDS: ${SKIP_HIDDEN_PERSON_IDS:-}  # comma-separated Canopy person ids (App Review)
      SKIP_TVS_LIMIT: ${SKIP_TVS_LIMIT:-5}  # Sponsor Block only TVs per person
      SKIP_TVS_LIMITS: ${SKIP_TVS_LIMITS:-}  # per-person overrides: <person id>=<n>,<person id>=<n>
      SKIP_CATEGORIES: ${SKIP_CATEGORIES:-sponsor,selfpromo,music_offtopic}
      SKIP_ADS: ${SKIP_ADS:-true}
      MUTE_ADS: ${MUTE_ADS:-false}
      AUTO_PLAY: ${AUTO_PLAY:-false}
      SKIP_MINIMUM_LENGTH: ${SKIP_MINIMUM_LENGTH:-1}
      SKIP_JOIN_NAME: ${SKIP_JOIN_NAME:-Canopy Control}
      SKIP_COUNT_TRACKING: ${SKIP_COUNT_TRACKING:-true}
    volumes:
      - api-data:/data
      - isbtv-config:/isbtv

  isponsorblocktv:
    <<: *hardening
    # Renovate keeps this current (renovate.json); updates auto-merge once CI passes.
    image: ghcr.io/dmunozv04/isponsorblocktv:v2.11.0@sha256:d1e876636754fb2b54490feebe3af4a321f7f2a932a2d57b67b2a667eea40823
    # The image's own ENTRYPOINT is ["python3", "-u", "main.pyc"] (WORKDIR /app, data in /app/data).
    # It runs here as `command`, a child of this wrapper: started once config.json lists a TV,
    # restarted when the file changes (mtime/size/inode polled every 3 s) or if it exits (backoff
    # 5 s doubling to 5 min), and sent SIGTERM when the container stops, then SIGKILL after 1 s
    # (v2.11.0 never exits on SIGTERM while a TV is connected, see README). No $ in it (compose
    # would interpolate it).
    entrypoint:
      - python3
      - -c
      - |
        import json, os, signal, subprocess, sys, time
        CONFIG = os.path.join(os.environ.get("iSPBTV_data_dir") or "data", "config.json")
        POLL_S = float(os.environ.get("WRAPPER_POLL_S") or 3)
        STOP_S = float(os.environ.get("WRAPPER_STOP_S") or 1)
        cmd = sys.argv[1:]
        child, stopping = None, False

        def log(msg):
            print("[wrapper] " + msg, flush=True)

        def stamp():
            try:
                st = os.stat(CONFIG)
                return (st.st_mtime_ns, st.st_size, st.st_ino)
            except OSError:
                return None

        def device_count():
            try:
                with open(CONFIG, encoding="utf-8") as f:
                    return len(json.load(f).get("devices") or [])
            except FileNotFoundError:
                return 0
            except Exception as ex:
                log(f"can't read {CONFIG}: {ex}")
                return 0

        def stop_child():
            global child
            if child is not None and child.poll() is None:
                child.send_signal(signal.SIGTERM)
                try:
                    child.wait(STOP_S)
                except subprocess.TimeoutExpired:
                    log(f"iSponsorBlockTV didn't stop in {STOP_S:g} s: killing it")
                    child.kill()
                    child.wait()
            child = None

        def on_signal(signum, frame):
            global stopping
            stopping = True
            if child is not None and child.poll() is None:
                child.send_signal(signal.SIGTERM)

        signal.signal(signal.SIGTERM, on_signal)
        signal.signal(signal.SIGINT, on_signal)
        log(f"watching {os.path.abspath(CONFIG)}; command: {' '.join(cmd)}")
        seen, want, delay, restart_at, started = "unset", False, 5, 0.0, 0.0
        while not stopping:
            s = stamp()
            if s != seen:
                if seen != "unset":
                    log("config.json changed")
                seen = s
                stop_child()
                want, delay, restart_at = device_count() > 0, 5, 0.0
                if not want:
                    log("no devices in config.json: iSponsorBlockTV not running until that changes")
            if child is not None and child.poll() is not None:
                if time.monotonic() - started > 60:
                    delay = 5
                log(f"iSponsorBlockTV exited with code {child.returncode}: restarting in {delay} s")
                child, restart_at, delay = None, time.monotonic() + delay, min(delay * 2, 300)
            if want and child is None and not stopping and time.monotonic() >= restart_at:
                log(f"starting iSponsorBlockTV for {device_count()} device(s)")
                child, started = subprocess.Popen(cmd), time.monotonic()
            time.sleep(POLL_S)
        stop_child()
        log("stopped")
    # The image's main.pyc, run by a few lines that first make iSponsorBlockTV bind to each TV's
    # Lounge with a remote id of its own. v2.11.0's connect() sends the TV's own screen id as its
    # remote "id" (our api had the same problem with pyytlounge: see lounge.py), which we suspect
    # knocks the TV's YouTube app out of its own session. connect() below is v2.11.0's, unchanged
    # but for "id": a stable uuid5 per TV. It's swapped in only if upstream's still compiles to
    # v2.11.0's strings and names; otherwise it logs that and runs unpatched. The CI smoke test
    # checks the patch against the pinned image. No $ in it (compose would interpolate it).
    command:
      - python3
      - -u
      - -c
      - |
        import runpy, sys, uuid
        from iSponsorBlockTV import ytlounge
        Api = ytlounge.YtLoungeApi
        original = Api.connect
        REMOTE_ID_NS = uuid.UUID("c9d837e6-a56b-4605-ba6f-bc39a6d9e93c")
        # v2.11.0's connect(), compiled by the image's Python: its string constants and names
        V2_11_0_STRS = {
            "/bc/bind", "1", "3", "8", "Attempt to connect using the previously set tokens", "CVER",
            "Connection denied", "Connection denied, attempting to circumvent the issue",
            "Handle connect failed, status %s reason %s", "MDX_SESSION_SOURCE_UNKNOWN", "Not linked",
            "REMOTE_CONTROL", "RID", "TYPE", "Unknown reply to connect %i %s", "VER", "app",
            "capabilities", "cl", "connectParams", "device", "false", "id", "loungeIdToken", "manual",
            "mdx-version", "name", "pairing_type", "que,dsdtr,atp,vsp", "sessionSource", "theme", "ui",
            "xmlhttp", "ytios-phone-20.15.1", '{"setStatesParams": "{"playbackSpeed":0}"}',
        }
        V2_11_0_NAMES = (
            "linked", "NotLinkedException", "auth", "screen_id", "lounge_id_token", "device_name",
            "api_base", "session", "post", "text", "status", "_logger", "warning", "connect_as_screen",
            "reason", "splitlines", "_parse_event_chunks", "as_aiter", "_process_events",
            "_command_offset", "connected", "exception",
        )


        def remote_id(screen_id):
            """Stable across restarts, distinct per TV, never the TV's own id (nor our api's)."""
            return str(uuid.uuid5(REMOTE_ID_NS, "isponsorblocktv:" + screen_id))


        async def connect(self) -> bool:
            """Attempt to connect using the previously set tokens"""
            if not self.linked():
                raise NotLinkedException("Not linked")

            connect_body = {
                "id": remote_id(self.auth.screen_id),
                "mdx-version": "3",
                "TYPE": "xmlhttp",
                "theme": "cl",
                "sessionSource": "MDX_SESSION_SOURCE_UNKNOWN",
                "connectParams": '{"setStatesParams": "{"playbackSpeed":0}"}',
                "RID": "1",
                "CVER": "1",
                "capabilities": "que,dsdtr,atp,vsp",
                "ui": "false",
                "app": "ytios-phone-20.15.1",
                "pairing_type": "manual",
                "VER": "8",
                "loungeIdToken": self.auth.lounge_id_token,
                "device": "REMOTE_CONTROL",
                "name": self.device_name,
            }
            connect_url = f"{api_base}/bc/bind"
            async with self.session.post(url=connect_url, data=connect_body) as resp:
                try:
                    text = await resp.text()
                    if resp.status == 401:
                        if "Connection denied" in text:
                            self._logger.warning(
                                "Connection denied, attempting to circumvent the issue"
                            )
                            await self.connect_as_screen()
                        # self._lounge_token_expired()
                        return False

                    if resp.status != 200:
                        self._logger.warning("Unknown reply to connect %i %s", resp.status, resp.reason)
                        return False
                    lines = text.splitlines()
                    async for events in self._parse_event_chunks(as_aiter(lines)):
                        await self._process_events(events)
                    self._command_offset = 1
                    return self.connected()
                except:
                    self._logger.exception(
                        "Handle connect failed, status %s reason %s",
                        resp.status,
                        resp.reason,
                    )
                    raise


        try:
            from iSponsorBlockTV.ytlounge import NotLinkedException, api_base, as_aiter
            code = original.__code__
            same = ({c for c in code.co_consts if isinstance(c, str)} == V2_11_0_STRS
                    and code.co_names == V2_11_0_NAMES)
        except Exception:
            same = False
        if same:
            Api.connect = connect
            print("[patch] iSponsorBlockTV binds with its own remote id", flush=True)
        else:
            print("[patch] iSponsorBlockTV's connect changed: running it unpatched", flush=True)
        if sys.argv[1:] != ["--patch-only"]:
            sys.argv = ["main.pyc"]
            runpy.run_path("main.pyc", run_name="__main__")
    stop_grace_period: 20s
    # api first: it creates the shared volume (owned by 10001, from its image) and the config
    depends_on: [api]
    volumes:
      - isbtv-config:/app/data:ro

volumes:
  api-data:
  isbtv-config:
